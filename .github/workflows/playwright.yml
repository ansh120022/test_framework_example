name: Playwright tests

on:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          GISTS_TOKEN: ${{ secrets.GISTS_TOKEN }}
          NO_GISTS_ACCESS_TOKEN: ${{ secrets.NO_GISTS_ACCESS_TOKEN }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

  deploy-report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
